[workspace]
members = [
  "crates/config",
  "crates/operation-log",
  "crates/macos-log",
  "crates/agents",
  "crates/process",
  "crates/protocol",
  "crates/filesystem",
  "crates/git-service",
  "crates/terminald",
  "crates/terminald-client",
  "crates/server",
  "crates/automations",
  "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["http2", "macros", "ws"] }
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
futures-util = "0.3"
http = "1.3"
http-body-util = "0.1"
hyper = { version = "1.11", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
libc = "0.2"
mime_guess = "2.0"
md5 = "0.8"
percent-encoding = "2.3"
portable-pty = "0.9"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tokio-tungstenite = "0.29"
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["compression-full", "cors", "fs", "request-id", "trace"] }
tracing = "0.1"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.17", features = ["v4"] }
vte = { version = "0.15", default-features = false }
walkdir = "2.5"
