[package]
name = "aow-acp-client"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"

[dependencies]
aow-runtime-contract = { path = "../runtime-contract" }
aow-i18n = { path = "../i18n" }
aow-db = { package = "aow-storage", path = "../storage" }
aow-protocol = { path = "../protocol" }
agent-client-protocol = { version = "=3.4.0", features = ["unstable", "unstable_protocol_v2"] }
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures = "0.3"
serde.workspace = true
serde_json.workspace = true
serde_json_lenient = "0.2"
tokio.workspace = true
tokio-util = { workspace = true, features = ["compat"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
rusqlite.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3.20"
