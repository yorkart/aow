[workspace]
members = [
    "crates/id",
    "crates/protocol",
    "crates/i18n",
    "crates/process",
    "crates/macos-log",
    "crates/filesystem",
    "crates/storage",
    "crates/acp-client",
    "crates/runtime-contract",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
libc = "0.2"
mime_guess = "2.0"
portable-pty = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.17", features = ["v4"] }
