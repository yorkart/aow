[package]
name = "aow-runtime-client"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"

[features]
test-support = ["dep:tempfile"]

[dependencies]
aow-runtime-contract = { path = "../../../common/crates/runtime-contract" }
tempfile = { version = "3.20", optional = true }
aow-acp-client = { path = "../../../common/crates/acp-client" }
aow-protocol = { path = "../../../common/crates/protocol" }
aow-filesystem = { path = "../../../common/crates/filesystem" }
aow-i18n = { path = "../../../common/crates/i18n" }
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures = "0.3"
futures-util.workspace = true
http.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["compat"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
uuid.workspace = true

[dev-dependencies]
aow-process = { path = "../../../common/crates/process" }
libc.workspace = true
tempfile = "3.20"

[[test]]
name = "terminal"
required-features = ["test-support"]

[[test]]
name = "acp"
required-features = ["test-support"]
