[package]
name = "aow-automations"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aow-automation-runner"
path = "src/main.rs"

[dependencies]
aow-cli-access = { path = "../cli-access" }
aow-runtime-client = { path = "../runtime-client" }
aow-i18n = { path = "../../../common/crates/i18n" }
aow-id = { path = "../../../common/crates/id" }
aow-agents = { path = "../agents", features = ["automation", "sessions"] }
aow-config = { path = "../config" }
aow-workspaces = { path = "../workspaces" }
anyhow.workspace = true
http.workspace = true
tracing.workspace = true
chrono.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tempfile = "3.20"
uuid.workspace = true

[dev-dependencies]
aow-runtime-client = { path = "../runtime-client", features = ["test-support"] }
