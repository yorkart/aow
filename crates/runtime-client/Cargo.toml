[package]
name = "aow-runtime-client"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"

[features]
test-support = ["dep:aow-runtime-daemon", "dep:tempfile", "dep:aow-terminald"]

[dependencies]
aow-runtime-daemon = { path = "../../runtime/crates/runtime-daemon", optional = true }
aow-terminald = { path = "../../runtime/crates/terminald", optional = true }
tempfile = { version = "3.20", optional = true }
aow-acp = { path = "../../runtime/crates/acp" }
aow-protocol = { path = "../protocol" }
aow-filesystem = { path = "../filesystem" }
aow-i18n = { path = "../i18n" }
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures = "0.3"
futures-util.workspace = true
http.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["compat"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
uuid.workspace = true

[dev-dependencies]
aow-process = { path = "../process" }
libc.workspace = true
aow-runtime-daemon = { path = "../../runtime/crates/runtime-daemon" }
tempfile = "3.20"

[[test]]
name = "terminal"
required-features = ["test-support"]
