[package]
name = "aow-agents"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
launch = ["dep:serde", "dep:thiserror", "dep:anyhow", "dep:serde_json", "dep:tokio", "dep:aow-config"]
sessions = ["dep:anyhow", "dep:chrono", "dep:serde", "dep:serde_json", "dep:thiserror", "dep:walkdir", "dep:tokio", "dep:aow-db", "dep:aow-id", "dep:aow-process"]
automation = ["dep:anyhow", "dep:serde", "dep:serde_json", "dep:tokio", "dep:aow-config"]

[dependencies]
aow-i18n = { path = "../i18n" }
aow-config = { path = "../config", optional = true }
aow-db = { path = "../db", optional = true }
aow-id = { path = "../id", optional = true }
aow-process = { path = "../process", optional = true }
anyhow = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }

[dev-dependencies]
rusqlite.workspace = true
tempfile = "3.20"
