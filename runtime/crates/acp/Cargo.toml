[package]
name = "aow-acp"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"

[dependencies]
acp-client = { package = "aow-acp-client", path = "../../../common/crates/acp-client" }
aow-i18n = { path = "../../../common/crates/i18n" }
aow-db = { package = "aow-storage", path = "../../../common/crates/storage" }
aow-protocol = { path = "../../../common/crates/protocol" }
anyhow.workspace = true
async-trait.workspace = true
futures = "0.3"
flate2 = "1"
libc.workspace = true
reqwest.workspace = true
semver = "1"
serde.workspace = true
serde_json.workspace = true
serde_json_lenient = "0.2"
sha2 = "0.10"
tar = "0.4"
tokio.workspace = true
tokio-util = { workspace = true, features = ["compat"] }
tracing.workspace = true
uuid.workspace = true
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
rusqlite.workspace = true
