[package]
name = "aow-runtime-agents"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
launch = ["dep:serde", "dep:thiserror", "dep:anyhow", "dep:serde_json", "dep:tokio"]
sessions = ["dep:anyhow", "dep:chrono", "dep:serde", "dep:serde_json", "dep:thiserror", "dep:walkdir", "dep:tokio", "dep:aow-db", "dep:aow-id", "dep:aow-process"]
automation = ["dep:anyhow", "dep:serde", "dep:serde_json", "dep:tokio"]

[dependencies]
aow-protocol = { path = "../../../common/crates/protocol" }
aow-i18n = { path = "../../../common/crates/i18n" }
aow-db = { package = "aow-storage", path = "../../../common/crates/storage", optional = true }
aow-id = { path = "../../../common/crates/id", optional = true }
aow-process = { path = "../../../common/crates/process", optional = true }
anyhow = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }

[dev-dependencies]
rusqlite.workspace = true
tempfile = "3.20"

[lib]
name = "aow_agents"
