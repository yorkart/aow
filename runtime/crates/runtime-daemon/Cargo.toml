[package]
name = "aow-runtime-daemon"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"

[dependencies]
aow-runtime-contract = { path = "../../../common/crates/runtime-contract" }
aow-acp-core = { path = "../acp-core" }
aow-runtime-exec = { path = "../exec" }
tempfile = "3.20"
aow-workspaces = { package = "aow-runtime-workspace", path = "../workspace" }
aow-runtime-environment = { path = "../environment" }
aow-protocol = { path = "../../../common/crates/protocol" }
rusqlite.workspace = true
chrono.workspace = true
futures-util.workspace = true
aow-agents = { package = "aow-runtime-agents", path = "../agents", features = ["launch", "sessions", "automation"] }
anyhow.workspace = true
aow-acp-service = { path = "../acp-service" }
aow-terminal-core = { path = "../terminal-core" }
aow-terminal-service = { path = "../terminal-service" }
aow-filesystem = { package = "aow-runtime-filesystem", path = "../filesystem" }
axum.workspace = true
clap.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
aow-process = { package = "aow-runtime-process", path = "../process" }
async-trait.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
aow-macos-log = { package = "aow-runtime-macos-log", path = "../macos-log" }
