[package]
name = "aow-terminal-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aow-i18n = { package = "aow-runtime-i18n", path = "../i18n" }
aow-runtime-contract = { path = "../../../common/crates/runtime-contract" }
aow-filesystem = { package = "aow-runtime-filesystem", path = "../filesystem" }
aow-id = { path = "../../../common/crates/id" }
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures-util = { workspace = true, features = ["sink"] }
libc.workspace = true
md5.workspace = true
portable-pty.workspace = true
aow-agents-core = { path = "../agents-core", features = ["sessions"] }
aow-process = { package = "aow-runtime-process", path = "../process" }
aow-protocol = { path = "../../../common/crates/protocol" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile = "3.20"
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true
vte.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
aow-macos-log = { path = "../../../common/crates/macos-log" }
