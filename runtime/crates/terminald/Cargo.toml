[package]
name = "aow-terminald"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aow-filesystem = { package = "aow-runtime-filesystem", path = "../filesystem" }
aow-id = { package = "aow-runtime-id", path = "../id" }
anyhow.workspace = true
axum.workspace = true
bytes.workspace = true
futures-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
libc.workspace = true
portable-pty.workspace = true
aow-agents = { package = "aow-runtime-agents", path = "../agents", features = ["sessions"] }
aow-process = { package = "aow-runtime-process", path = "../process" }
aow-protocol = { package = "aow-runtime-protocol", path = "../protocol" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile = "3.20"
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true
tracing-subscriber.workspace = true
vte.workspace = true

[dev-dependencies]
tokio-tungstenite.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
aow-macos-log = { package = "aow-runtime-macos-log", path = "../macos-log" }
