[package]
name = "aow-agents-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
launch = ["dep:serde", "dep:thiserror", "dep:anyhow", "dep:serde_json", "dep:tokio"]
sessions = ["dep:async-trait", "dep:anyhow", "dep:chrono", "dep:serde", "dep:serde_json", "dep:thiserror", "dep:walkdir", "dep:tokio", "dep:aow-db", "dep:aow-id", "dep:aow-process"]
automation = ["dep:anyhow", "dep:serde", "dep:serde_json", "dep:tokio"]

management = ["launch", "sessions", "automation", "dep:rusqlite", "dep:uuid", "dep:tempfile", "dep:tracing", "dep:aow-workspaces", "dep:aow-host-environment", "aow-process/execution"]

[dependencies]
aow-host-contract = { path = "../../../common/crates/host-contract" }
aow-i18n = { package = "aow-host-i18n", path = "../i18n" }
aow-db = { package = "aow-host-db", path = "../db", optional = true }
aow-id = { path = "../../../common/crates/id", optional = true }
aow-process = { package = "aow-host-process", path = "../process", optional = true }
anyhow = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }

async-trait = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
tempfile = { version = "3.20", optional = true }
tracing = { workspace = true, optional = true }
aow-workspaces = { package = "aow-host-workspace", path = "../workspace", optional = true }
aow-host-environment = { path = "../environment", optional = true }

[dev-dependencies]
rusqlite.workspace = true
tempfile = "3.20"
