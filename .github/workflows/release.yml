name: CI and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish an in-flight main release before another run can advance latest.
concurrency:
  group: aow-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install lint tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python3 -m venv "$RUNNER_TEMP/lint-venv"
          "$RUNNER_TEMP/lint-venv/bin/python" -m pip install --disable-pip-version-check -r scripts/lint/requirements.txt
          echo "$RUNNER_TEMP/lint-venv/bin" >> "$GITHUB_PATH"
          curl --fail --silent --show-error --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/lint-venv/bin" actionlint
      - name: Lint TypeScript, JavaScript, CSS, HTML, configuration and Markdown
        run: npm run lint
      - name: Lint Python
        run: npm run lint:python
      - name: Lint shell scripts and extensionless launchers
        run: npm run lint:shell
      - name: Lint YAML and GitHub Actions
        run: |
          npm run lint:yaml
          npm run lint:workflows

  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      native-packages: ${{ steps.scope.outputs.native-packages }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Select native package validation
        id: scope
        run: node scripts/ci/release-scope.mjs
      - id: version
        run: echo "version=v$(date -u +%Y.%m.%d)-${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vt-worker/package-lock.json
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: test-${{ matrix.runner }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test VT worker
        run: |
          npm --prefix vt-worker ci --ignore-scripts --no-audit --no-fund
          npm --prefix vt-worker test
      - name: Test Rust workspace
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            TMPDIR="$(node -p 'require("node:fs").realpathSync(require("node:os").tmpdir())')"
            export TMPDIR
          fi
          cargo test --workspace --locked -- --test-threads=4
      - name: Check Rust formatting and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check macOS C bridge
        if: runner.os == 'macOS'
        run: |
          clang -Wall -Wextra -Werror -fsyntax-only crates/macos-log/src/os_log.c
          clang --analyze -Xanalyzer -analyzer-output=text -Xanalyzer -analyzer-werror -Wall -Wextra -Werror crates/macos-log/src/os_log.c

  test-scripts:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Test packaging, installers and service lifecycle
        run: node --test scripts/tests/*.test.mjs

  frontend:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            vt-worker/package-lock.json
      - name: Build and check frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm --prefix frontend ci --ignore-scripts --no-audit --no-fund
          npm --prefix frontend run build
          npm --prefix frontend run test:architecture
      - name: Build portable VT worker bundle
        if: needs.version.outputs.native-packages == 'true'
        run: |
          npm --prefix vt-worker ci --ignore-scripts --no-audit --no-fund
          npm --prefix vt-worker run build
      - name: Upload shared web assets
        if: needs.version.outputs.native-packages == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-assets
          path: |
            frontend/dist/
            vt-worker/dist/
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [version, frontend]
    if: needs.version.outputs.native-packages == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            platform: macos-x86_64
            target: x86_64-apple-darwin
          - runner: macos-15
            platform: macos-aarch64
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
      RUST_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Set up Rust target
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$RUST_TARGET"
      - name: Set up musl compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools binutils
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.platform }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Download shared web assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: web-assets
          path: .
      - name: Build and validate native package
        run: |
          package=$(bash scripts/package-release.sh --version "$RELEASE_VERSION" --skip-web-build --output-dir "$RUNNER_TEMP/aow-packages")
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp "$package" "$RUNNER_TEMP/release-assets/aow-$RELEASE_PLATFORM.tar.gz"
      - name: Smoke test real macOS package with isolated services
        if: runner.os == 'macOS'
        env:
          AOW_NATIVE_TEST_PACKAGE: ${{ runner.temp }}/release-assets/aow-${{ matrix.platform }}.tar.gz
        run: node --test --test-name-pattern='real AoW macOS release' scripts/tests/macos-release.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-assets/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: [version, lint, test, test-scripts, frontend, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: package-*
          path: target/github-packages
          merge-multiple: true
      - name: Prepare complete release and checksums
        run: |
          node scripts/prepare-github-release.mjs "$RELEASE_VERSION" "$GITHUB_SHA" "$GITHUB_REPOSITORY" target/github-packages target/github-release
      - name: Publish complete release
        run: bash scripts/publish-github-release.sh "$RELEASE_VERSION" "$GITHUB_SHA" target/github-release
